<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto_para_andrea/opcion2/style.css">
    <title>¡Feliz cumpleaños!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/proyecto_para_andrea/imagenes/torta-de-cumpleanos.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tu verdadero regalo</h1>
            <p>¿Cómo quieres gastar tus 50€?</p>
        </header>
        
        <div class="budget-info">
            <p>Presupuesto total:</p>
            <div class="total-budget">50€</div>
            <p>Te quedan:</p>
            <div id="remaining" class="remaining">50€</div>
        </div>
        
        <form id="budgetForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="a9485d88-2e71-421b-8d96-af493e53d511">
            <input type="hidden" name="subject" value="Distribución de Presupuesto - 50€">
            <input type="hidden" name="nombre" value="Alexandra">
            <input type="hidden" name="correo" value="samuelriveiraescudero@gmail.com">
            
            <div class="activities">
                <div class="activity-card">
                    <div class="activity-header">
                        <h3 class="activity-title">Ir de compras</h3>
                        <div id="shopping-amount" class="activity-amount">0€</div>
                    </div>
                    <div class="activity-image">
                        <img src="https://cdn-icons-png.flaticon.com/512/3225/3225194.png" alt="Icono de compras">
                    </div>
                    <div class="slider-container">
                        <input type="range" id="shopping-slider" name="shopping" min="0" max="50" value="0" step="1">
                        <div class="amount-info">
                            <span>0€</span>
                            <span>50€</span>
                        </div>
                    </div>
                </div>
                
                <div class="activity-card">
                    <div class="activity-header">
                        <h3 class="activity-title">Ir a comer</h3>
                        <div id="food-amount" class="activity-amount">0€</div>
                    </div>
                    <div class="activity-image">
                        <img src="https://cdn-icons-png.flaticon.com/512/1147/1147805.png" alt="Icono de comida">
                    </div>
                    <div class="slider-container">
                        <input type="range" id="food-slider" name="food" min="0" max="50" value="0" step="1">
                        <div class="amount-info">
                            <span>0€</span>
                            <span>50€</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <textarea id="budgetDistribution" name="mensaje" class="hidden"></textarea>
            
            <div class="contact-form">
                <button type="submit" class="btn-submit" id="submitBtn">¡Enviar mis elecciones!</button>
            </div>
        </form>
    </div>
    
    <script>
        // Variables para el presupuesto
        const totalBudget = 50;
        let shoppingAmount = 0;
        let foodAmount = 0;
        let remaining = totalBudget;
        
        // Elementos DOM
        const shoppingSlider = document.getElementById('shopping-slider');
        const foodSlider = document.getElementById('food-slider');
        const shoppingAmountElement = document.getElementById('shopping-amount');
        const foodAmountElement = document.getElementById('food-amount');
        const remainingElement = document.getElementById('remaining');
        const submitBtn = document.getElementById('submitBtn');
        const budgetDistributionElement = document.getElementById('budgetDistribution');
        
        // Función para actualizar los valores y la interfaz
        function updateValues() {
            shoppingAmount = parseInt(shoppingSlider.value);
            foodAmount = parseInt(foodSlider.value);
            
            // Verificar si excede el presupuesto
            if (shoppingAmount + foodAmount > totalBudget) {
                // Si ajustamos el slider de compras, ajustamos el de comida
                if (document.activeElement === shoppingSlider) {
                    foodAmount = Math.max(0, totalBudget - shoppingAmount);
                    foodSlider.value = foodAmount;
                } 
                // Si ajustamos el slider de comida, ajustamos el de compras
                else {
                    shoppingAmount = Math.max(0, totalBudget - foodAmount);
                    shoppingSlider.value = shoppingAmount;
                }
            }
            
            // Actualizar la visualización
            shoppingAmountElement.textContent = shoppingAmount + '€';
            foodAmountElement.textContent = foodAmount + '€';
            
            // Calcular lo que queda
            remaining = totalBudget - (shoppingAmount + foodAmount);
            remainingElement.textContent = remaining + '€';
            
            // Cambiar el color según lo que queda (gradient desde 50 a 0)
            const percentage = remaining / totalBudget; // Porcentaje de presupuesto restante
            const hue = percentage * 120; // 120 es verde, 0 es rojo en HSL
            remainingElement.style.color = `hsl(${hue}, 80%, 45%)`;
            
            // Generar mensaje para el envío
            let message = `Distribución de presupuesto:\n\n`;
            message += `- Ir de compras: ${shoppingAmount}€\n`;
            message += `- Ir a comer: ${foodAmount}€\n\n`;
            message += `Total asignado: ${shoppingAmount + foodAmount}€\n`;
            message += `Presupuesto restante: ${remaining}€`;
            
            budgetDistributionElement.value = message;
        }
        
        // Eventos para los sliders
        shoppingSlider.addEventListener('input', updateValues);
        foodSlider.addEventListener('input', updateValues);
        
        // Inicializar la interfaz
        updateValues();
        
        // Evento para enviar el formulario
        document.getElementById('budgetForm').addEventListener('submit', function(event) {
            // Verificar si ha asignado algo de presupuesto
            if (shoppingAmount === 0 && foodAmount === 0) {
                event.preventDefault();
                alert('Por favor, asigna algo de presupuesto a al menos una actividad.');
                return;
            }
        });
        
        // Animación al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('header');
            header.style.opacity = '0';
            
            setTimeout(function() {
                header.style.transition = 'opacity 1s ease-out';
                header.style.opacity = '1';
            }, 300);
        });
    </script>
</body>
</html>
