<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto_para_andrea/style.css">
    <title>¡Feliz cumpleaños!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/proyecto habitaciones/img/viajar.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>¡Feliz Cumpleaños!</h1>
        <div class="message">Elige una opción para ver tu sorpresa especial</div>
        <div class="buttons">
            <button class="btn" onclick="window.location.href='/proyecto_para_andrea/opcion1/index.html'">Opción 1</button>
            <button class="btn" onclick="window.location.href='opcion2.html'">Opción 2</button>
        </div>
    </div>
    
    <script>
        // Crear confeti animado
        function createConfetti() {
            const colors = ['#ff61a6', '#ffb3d9', '#ffcce6', '#ff8cc2', '#ff1a75', '#ffffe0', '#ffd700'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Formas aleatorias para el confeti
                const shape = Math.floor(Math.random() * 3);
                if (shape === 0) {
                    confetti.style.borderRadius = '50%'; // Círculo
                } else if (shape === 1) {
                    confetti.style.width = '10px';
                    confetti.style.height = '25px';
                } else {
                    confetti.style.transform = 'rotate(45deg)';
                }
                
                document.body.appendChild(confetti);
            }
        }
        
        // Llamar a la función cuando la página cargue
        window.onload = createConfetti;
    </script>
</body>
</html>
