<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto_para_andrea/style.css">
    <title>¡Feliz cumpleaños!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/proyecto_para_andrea/imagenes/torta-de-cumpleanos.png" type="image/x-icon">
</head>
<body>
    <!-- Pantalla de introducción -->
    <div class="intro-container">
        <h1>¡Felices 18!</h1>
        <img src="/proyecto_para_andrea/imagenes/foto-andrea.jpg" alt="Foto de amigas" class="intro-img pulse" id="birthdayImage">
        <div class="character">
            <img src="/proyecto_para_andrea/imagenes/Tamaki-removebg-preview.png" alt="Personaje" class="character-img">
            <div class="speech-bubble">
                ¿Qué pasará si le damos a la foto?
            </div>
        </div>
    </div>
    
    <!-- Contenido principal (oculto inicialmente) -->
    <div class="main-container" id="mainContent">
        <h1>¡Feliz Cumpleaños!</h1>
        <div class="message">Elige una opción para ver tu sorpresa especial</div>
        <div class="buttons">
            <button class="btn" onclick="window.location.href='/proyecto_para_andrea/opcion1/index.html'">¿Qué haremos este último verano en la isla?</button>
            <button class="btn" onclick="window.location.href='/proyecto_para_andrea/opcion2/index.html'">Tu verdadero regalo</button>
            <button class="btn" onclick="window.location.href='/proyecto_para_andrea/opcion3/index.html'">Nuestro tiempo juntas</button>
        </div>
    </div>
    
    <script>
        // Crear confeti animado
        function createConfetti() {
            const colors = ['#ff61a6', '#ffb3d9', '#ffcce6', '#ff8cc2', '#ff1a75', '#ffffe0', '#ffd700'];
            
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 5 + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                // Formas aleatorias para el confeti
                const shape = Math.floor(Math.random() * 3);
                if (shape === 0) {
                    confetti.style.borderRadius = '50%'; // Círculo
                } else if (shape === 1) {
                    confetti.style.width = '10px';
                    confetti.style.height = '25px';
                } else {
                    confetti.style.transform = 'rotate(45deg)';
                }
                
                document.body.appendChild(confetti);
            }
        }
        
        // Iniciar confeti cuando la página cargue
        window.onload = createConfetti;
        
        // Añadir funcionalidad al hacer clic en la imagen
        document.getElementById('birthdayImage').addEventListener('click', function() {
            // Ocultar la pantalla de introducción
            document.querySelector('.intro-container').style.opacity = '0';
            document.querySelector('.intro-container').style.transform = 'scale(0.8)';
            
            // Mostrar el contenido principal con animación
            setTimeout(function() {
                document.querySelector('.intro-container').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                
                // Trigger reflow para que la animación funcione
                void document.getElementById('mainContent').offsetWidth;
                
                document.getElementById('mainContent').style.opacity = '1';
                document.getElementById('mainContent').style.transform = 'scale(1)';
                
                // Crear más confeti para la celebración
                for (let i = 0; i < 3; i++) {
                    setTimeout(createConfetti, i * 500);
                }
            }, 500);
        });
    </script>
</body>
</html>
