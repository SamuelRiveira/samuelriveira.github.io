<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto_para_andrea/opcion1/style.css">
    <title>¡Feliz cumpleaños!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/proyecto_para_andrea/imagenes/torta-de-cumpleanos.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <header>
            <h1>¡Felices 18 Alex!</h1>
            <p>Elige lo que quieres que hagamos este verano</p>
        </header>
        
        <h2>Nuestros Planes de Verano</h2>
        
        <form id="birthdayForm" action="https://api.web3forms.com/submit" method="POST">
            <input type="hidden" name="access_key" value="a9485d88-2e71-421b-8d96-af493e53d511">
            <input type="hidden" name="subject" value="Selección de Actividades de Verano - Alexandra">
            <input type="hidden" name="nombre" value="Alexandra">
            <input type="hidden" name="correo" value="samuelriveiraescudero@gmail.com">
            
            <div class="activities">
                <div class="activity-card">
                    <img src="/proyecto_para_andrea/opcion1/imagenes/voley-andrea.jpg" alt="Torneo de voley playa" class="activity-image">
                    <div class="activity-info">
                        <div class="activity-checkbox">
                            <input type="checkbox" id="voley" name="actividades" value="Torneo de voley playa">
                            <label for="voley">Torneo de voley playa</label>
                        </div>
                    </div>
                </div>
                
                <div class="activity-card">
                    <img src="/proyecto_para_andrea/opcion1/imagenes/compras-andrea.jpg" alt="Ir de compras" class="activity-image">
                    <div class="activity-info">
                        <div class="activity-checkbox">
                            <input type="checkbox" id="compras" name="actividades" value="Ir de compras">
                            <label for="compras">Ir de compras</label>
                        </div>
                    </div>
                </div>
                
                <div class="activity-card">
                    <img src="/proyecto_para_andrea/opcion1/imagenes/pijamada-andrea.jpg" alt="Pijamada" class="activity-image">
                    <div class="activity-info">
                        <div class="activity-checkbox">
                            <input type="checkbox" id="pijamada" name="actividades" value="Hacer pijamadas y quedarnos despiertas todo el día">
                            <label for="pijamada">Hacer pijamadas y quedarnos despiertas todo el día</label>
                        </div>
                    </div>
                </div>
                
                <div class="activity-card">
                    <img src="/proyecto_para_andrea/opcion1/imagenes/maquillaje-andrea.jpg" alt="Maquillaje" class="activity-image">
                    <div class="activity-info">
                        <div class="activity-checkbox">
                            <input type="checkbox" id="maquillaje" name="actividades" value="Maquillarnos mútuamente">
                            <label for="maquillaje">Maquillarnos mútuamente</label>
                        </div>
                    </div>
                </div>
                
                <div class="activity-card">
                    <img src="/proyecto_para_andrea/opcion1/imagenes/peinados-andrea.jpg" alt="Peinados" class="activity-image">
                    <div class="activity-info">
                        <div class="activity-checkbox">
                            <input type="checkbox" id="peinados" name="actividades" value="Prueba de peinados">
                            <label for="peinados">Prueba de peinados</label>
                        </div>
                    </div>
                </div>
            </div>
            
            <textarea id="selectedActivities" name="mensaje" class="selected-activities"></textarea>
            
            <div class="contact-form">
                <button type="submit" class="btn-submit">¡Enviar mis elecciones!</button>
            </div>
        </form>
    </div>
    
    <script>
        document.getElementById('birthdayForm').addEventListener('submit', function(event) {
            // Recopilar actividades seleccionadas
            const checkboxes = document.querySelectorAll('input[name="actividades"]:checked');
            if (checkboxes.length === 0) {
                event.preventDefault();
                alert('Por favor, selecciona al menos una actividad para este verano.');
                return;
            }
            
            let selectedActivities = 'Actividades seleccionadas por Alexandra:\n';
            checkboxes.forEach(function(checkbox) {
                selectedActivities += '- ' + checkbox.value + '\n';
            });
            
            // Añadir al campo oculto
            document.getElementById('selectedActivities').value = selectedActivities;
        });
        
        // Animación al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            const header = document.querySelector('header');
            header.style.opacity = '0';
            
            setTimeout(function() {
                header.style.transition = 'opacity 1s ease-out';
                header.style.opacity = '1';
            }, 300);
        });
    </script>
</body>
</html>
