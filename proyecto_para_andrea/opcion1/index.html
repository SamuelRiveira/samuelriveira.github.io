<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/proyecto_para_andrea/opcion1/style.css">
    <title>¡Feliz cumpleaños!</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/proyecto habitaciones/img/viajar.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <h1>¡Feliz Cumpleaños, Amiga!</h1>
        
        <div class="message">
            <p>En este día tan especial, quiero desearte el cumpleaños más feliz del mundo. Cada momento contigo es un regalo, y espero que este nuevo año de vida esté lleno de alegría, amor y sueños cumplidos.</p>
            <p>¡Gracias por ser una amiga maravillosa!</p>
        </div>
        
        <div class="carousel">
            <div class="carousel-inner">
                <!-- Aquí puedes reemplazar las imágenes con las tuyas propias -->
                <div class="carousel-item">
                    <img src="/api/placeholder/600/400" alt="Recuerdo 1">
                </div>
                <div class="carousel-item">
                    <img src="/api/placeholder/600/400" alt="Recuerdo 2">
                </div>
                <div class="carousel-item">
                    <img src="/api/placeholder/600/400" alt="Recuerdo 3">
                </div>
                <div class="carousel-item">
                    <img src="/api/placeholder/600/400" alt="Recuerdo 4">
                </div>
            </div>
            <button class="carousel-control carousel-control-prev" onclick="moveCarousel(-1)">&#10094;</button>
            <button class="carousel-control carousel-control-next" onclick="moveCarousel(1)">&#10095;</button>
        </div>
        
        <a href="/proyecto_para_andrea/index.html" class="btn-back">Volver</a>
    </div>
    
    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.carousel-item');
        const totalSlides = slides.length;
        
        // Función para mover el carrusel
        function moveCarousel(direction) {
            currentSlide = (currentSlide + direction + totalSlides) % totalSlides;
            document.querySelector('.carousel-inner').style.transform = `translateX(-${currentSlide * 100}%)`;
        }
        
        // Cambio automático de diapositivas cada 4 segundos
        setInterval(() => {
            moveCarousel(1);
        }, 4000);
        
        // Soporte para gestos táctiles en el carrusel
        const carousel = document.querySelector('.carousel');
        let touchStartX = 0;
        let touchEndX = 0;
        
        carousel.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        }, false);
        
        carousel.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);
        
        function handleSwipe() {
            if (touchEndX < touchStartX - 50) {
                moveCarousel(1); // Deslice a la izquierda
            }
            if (touchEndX > touchStartX + 50) {
                moveCarousel(-1); // Deslice a la derecha
            }
        }
        
        // Añadir iconos de cumpleaños aleatorios
        function addBirthdayIcons() {
            const icons = ['🎂', '🎁', '🎈', '🎉', '🎊', '🥳', '✨', '🎯'];
            const body = document.body;
            const iconCount = window.innerWidth < 480 ? 12 : 20; // Menos iconos en móvil
            
            for (let i = 0; i < iconCount; i++) {
                const icon = document.createElement('div');
                icon.className = 'birthday-icons';
                icon.textContent = icons[Math.floor(Math.random() * icons.length)];
                icon.style.left = Math.random() * 100 + 'vw';
                icon.style.top = Math.random() * 100 + 'vh';
                icon.style.transform = `rotate(${Math.random() * 360}deg)`;
                body.appendChild(icon);
            }
        }
        
        window.onload = addBirthdayIcons;
    </script>
</body>
</html>
